name: PassCast live

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 min (GitHub may delay scheduled runs)
  workflow_dispatch:             # "Run workflow" button for a manual refresh
  push:
    branches: [main]             # also refresh whenever the code changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache terrain tiles
        uses: actions/cache@v4
        with:
          path: ~/.passcast/dem
          key: dem-v1-${{ hashFiles('passcast/config.py') }}
          restore-keys: dem-v1-
      - name: Install
        run: pip install -r requirements.txt
      - name: Score sites from the latest Himawari image
        run: |
          python -m passcast run --satellite himawari --index --out site \
            --only "Nathu La,Sela Pass,Kedarnath Helipad,Rohtang Pass,Kunzum Pass,Zoji La,Khardung La,Shillong Plateau"
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
