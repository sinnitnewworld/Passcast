name: PassCast live

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 min - Nitin
  workflow_dispatch:             # "Run workflow" button for a manual refresh
  push:
    branches: [main]             # also refresh whenever the code changes

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write                 # lets a run start the next one (see "next-refresh")

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache terrain tiles
        uses: actions/cache@v4
        with:
          path: ~/.passcast/dem
          key: dem-v1-${{ hashFiles('passcast/config.py') }}
          restore-keys: dem-v1-
      - name: Cache 1 km terrain for India
        uses: actions/cache@v4
        with:
          path: ~/.passcast/terrain1km_v2
          key: terrain1km-v2
      - name: Cache 90 m mountain terrain
        uses: actions/cache@v4
        with:
          path: ~/.passcast/terrain90_v1
          key: terrain90-v1
      - name: Install
        run: pip install -r requirements.txt
      - name: Pick the latest image slot
        run: echo "SLOT=$(python -c 'from passcast.satellite import latest_himawari_slot as s; print(s().strftime("%Y-%m-%dT%H:%M"))')" >> $GITHUB_ENV
      - name: Key sites at 30 m
        run: |
          python -m passcast run --satellite himawari --time "$SLOT" --index --out site \
            --only "Nathu La,Sela Pass,Kedarnath Helipad,Rohtang Pass,Kunzum Pass,Zoji La,Khardung La,Shillong Plateau"
      - name: All-India 1 km tiles + search page
        run: python -m passcast national --satellite himawari --time "$SLOT" --out site
      - name: Drone-caution events (news scan)
        continue-on-error: true
        run: python -m passcast events --out site
      - name: Probe browser access to 30 m terrain (CORS)
        continue-on-error: true
        run: |
          echo "### 30 m DEM CORS probe" >> "$GITHUB_STEP_SUMMARY"
          curl -s -o /dev/null -D - -H "Origin: https://sinnitnewworld.github.io" -H "Range: bytes=0-15" \
            "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N34_00_E077_00_DEM/Copernicus_DSM_COG_10_N34_00_E077_00_DEM.tif" \
            | grep -i -E "^HTTP|access-control" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh site/terrain90 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = pathlib.Path("site/manifest.json")
          if m.exists():
              man = json.loads(m.read_text())
              print(f"National: {len(man['tiles'])} tiles in {man['processing_s']} s")
              print("  " + ", ".join(f"{k} {v['profile']} valid {v['valid']:.0%} cloudy {v.get('cloudy',0):.0%}" for k, v in man['tiles'].items()) + "\n")
          f = pathlib.Path("site/latest.json")
          if not f.exists():
              print("no latest.json"); raise SystemExit
          d = json.loads(f.read_text())
          print(f"Image {d['image_time_utc']} · {d['satellite']}\n")
          for p in d["passes"]:
              print(f"- {p['name']}: {p['score']} ({p['confidence_label']}) obscured {p['obscured_fraction']:.2f}, "
                    f"top {p['cloud_top_m']}, classes {p['class_breakdown']} | {'; '.join(p['caveats'][:7])}")
          PY
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's own timer (schedule above) has never started for this repository, so each
  # run starts the next one itself: wait ~25 min, then trigger this workflow again.
  # Only one run exists at a time: the concurrency group cancels an older run (including
  # its wait) whenever a newer one starts, e.g. after a code push.
  next-refresh:
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait, then start the next refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1500
          gh workflow run live.yml --repo "${{ github.repository }}" --ref main

